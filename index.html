<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CustosoChat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="setup-screen" class="screen">
    <div class="card">
      <h1>CustosoChat</h1>
      <p class="subtitle">Um chat simples, direto entre você e seu amigo.</p>

      <label for="name-input">Seu nome</label>
      <input id="name-input" type="text" maxlength="20" placeholder="Como você quer aparecer?" autocomplete="off">

      <div class="tabs">
        <button id="tab-create" class="tab active" type="button">Criar sala</button>
        <button id="tab-join" class="tab" type="button">Entrar em uma sala</button>
      </div>

      <div id="panel-create" class="panel">
        <p class="hint">Você vai gerar um código. Envie esse código pro seu amigo (por WhatsApp, por exemplo) pra ele entrar na sala.</p>
        <button id="create-btn" class="primary" type="button">Gerar sala</button>
        <div id="room-code-box" class="room-code-box hidden">
          <span>Código da sala:</span>
          <div class="code-row">
            <code id="room-code-display"></code>
            <button id="copy-code-btn" type="button" title="Copiar código">Copiar</button>
          </div>
          <p id="create-status" class="status">Aguardando seu amigo entrar...</p>
        </div>
      </div>

      <div id="panel-join" class="panel hidden">
        <p class="hint">Cole aqui o código que seu amigo te enviou.</p>
        <input id="join-code-input" type="text" placeholder="Código da sala" autocomplete="off">
        <button id="join-btn" class="primary" type="button">Entrar</button>
        <p id="join-status" class="status"></p>
      </div>
    </div>
  </main>

  <main id="chat-screen" class="screen hidden">
    <header class="chat-header">
      <div class="chat-header-info">
        <strong id="room-title"></strong>
        <span id="connection-status" class="connection-status offline">desconectado</span>
      </div>
      <button id="leave-btn" type="button" title="Sair da sala">Sair</button>
    </header>

    <div id="messages" class="messages"></div>

    <form id="message-form" class="message-form">
      <input id="message-input" type="text" placeholder="Digite uma mensagem..." autocomplete="off" disabled>
      <button id="send-btn" type="submit" disabled>Enviar</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
